<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="100%" height="100%">
  <!-- Nintendo Style Outer Pill Container -->
  <rect x="10" y="10" width="380" height="120" rx="60" ry="60" fill="#E60012" stroke="#FFFFFF" stroke-width="8"/>
  <rect x="18" y="18" width="364" height="104" rx="52" ry="52" fill="none" stroke="#E60012" stroke-width="4"/>

  <!-- Brand Typography: piino -->
  <g fill="#FFFFFF">
    <!-- p -->
    <path d="M75,45 v60 h16 v-22 a18,18 0 1,0 0,-36 h-16 z M91,60 a9,9 0 1,1 0,18 a9,9 0 1,1 0,-18 z" />
    
    <!-- i (first) with Network Star Node Dot -->
    <rect x="135" y="60" width="16" height="45" rx="8" />
    <circle cx="143" cy="45" r="9" fill="#FFFFFF" />
    <!-- Star network node spikes on first i -->
    <line x1="143" y1="31" x2="143" y2="25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="143" y1="59" x2="143" y2="65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="129" y1="45" x2="123" y2="45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="157" y1="45" x2="163" y2="45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- i (second) -->
    <rect x="175" y="60" width="16" height="45" rx="8" />
    <circle cx="183" cy="45" r="8" fill="#FFFFFF" />

    <!-- n -->
    <path d="M210,60 v45 h16 v-25 a11,11 0 0,1 22,0 v25 h16 v-28 a23,23 0 0,0 -46,-5 z" />

    <!-- o -->
    <path d="M285,75 a22,22 0 1,0 44,0 a22,22 0 1,0 -44,0 z M301,75 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 z" />
  </g>
</svg>
