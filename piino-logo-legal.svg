<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- Distinct, Legal-Safe Red Tech Pill Badge -->
  <rect x="5" y="5" width="350" height="80" rx="24" fill="#E60012"/>
  
  <!-- Clean Node Network Icon Graphic inside Badge -->
  <g fill="#FFFFFF">
    <!-- P-Node Badge Icon -->
    <circle cx="45" cy="45" r="18" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="10" fill="#E60012"/>
    <circle cx="45" cy="45" r="4" fill="#FFFFFF"/>
    <line x1="45" y1="20" x2="45" y2="10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="70" x2="45" y2="80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="45" x2="10" y2="45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Professional Clean Geometry Typography: piino -->
    <text x="85" y="57" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="1">piino</text>
    
    <!-- Subtitle: STUDIO -->
    <text x="248" y="57" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="16" fill="rgba(255,255,255,0.75)" letter-spacing="3">STUDIO</text>
  </g>
</svg>
